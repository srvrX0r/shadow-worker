[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shadow-worker"
version = "1.1.0"
description = "Defensive security operations framework: authorized vulnerability scanning, SIEM, and threat detection"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Rodrigo Coll" }
]
keywords = [
    "security",
    "siem",
    "vulnerability-scanner",
    "threat-detection",
    "defensive-security",
    "sast",
    "dast"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "asyncio-throttle>=1.0.2",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "build>=1.2.0",
]
scanners = [
    "semgrep>=1.80.0",
    "bandit>=1.7.9",
]
detection = [
    "yara-python>=4.5.0",
]
queue = [
    "celery>=5.4.0",
    "redis>=5.0.0",
]
full = [
    "semgrep>=1.80.0",
    "bandit>=1.7.9",
    "yara-python>=4.5.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
]
web3 = [
    "web3>=6.0.0",
    "slither-analyzer>=0.10.0",
    "mythril>=0.24.0",
]
mobile = [
    "frida>=16.0.0",
    "objection>=1.11.0",
]

[project.scripts]
shadow = "shadow_worker.cli:main"
shadow-worker = "shadow_worker.cli:main"

[project.urls]
Homepage = "https://github.com/srvrX0r/shadow-worker"
Repository = "https://github.com/srvrX0r/shadow-worker"
Issues = "https://github.com/srvrX0r/shadow-worker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_worker"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F524", "F821"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["shadow_worker"]
branch = true
