[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadow-worker"
version = "1.0.0"
description = "Comprehensive defensive security operations framework - SIEM, vulnerability scanning, and threat detection for your infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Security Operations", email = "secops@example.com" }
]
keywords = [
    "security",
    "siem",
    "vulnerability-scanner",
    "threat-detection",
    "defensive-security",
    "sast",
    "dast"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "asyncio-throttle>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-nmap>=0.7.0",
    "yara-python>=4.3.0",
    "watchdog>=3.0.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "semgrep>=1.50.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
web3 = [
    "web3>=6.0.0",
    "slither-analyzer>=0.10.0",
    "mythril>=0.24.0",
]
mobile = [
    "frida>=16.0.0",
    "objection>=1.11.0",
]

[project.scripts]
shadow = "shadow_worker.cli:main"
shadow-worker = "shadow_worker.cli:main"

[project.urls]
Homepage = "https://github.com/shadow-worker/shadow-worker"
Documentation = "https://shadow-worker.readthedocs.io"
Repository = "https://github.com/shadow-worker/shadow-worker"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_worker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B"]
ignore = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
